# Integración continua: se ejecuta en cada Pull Request hacia main y en cada push a main.
# Un PR solo puede fusionarse si todos los jobs pasan (configurar como "required checks").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, formato y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck

  test:
    name: Tests y cobertura (≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vitest con umbral de cobertura
        run: npm run test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines","statements","functions","branches"]
                .map(k => `| ${k} | ${t[k].pct}% |`).join("\n");
              console.log(`### Cobertura de tests\n\n| Métrica | % |\n|---|---|\n${rows}`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    name: Build (SDK + demo)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verificar que el bundle del SDK sea solo ASCII
        # El widget se incrusta en sitios de terceros que pueden no declarar UTF-8.
        run: |
          if LC_ALL=C grep -lP '[^\x00-\x7F]' dist/lib/*.js dist/embed/*.js; then
            echo "::error::El bundle contiene caracteres no ASCII (ver plugin asciiOnly en vite.lib.config.ts)"
            exit 1
          fi
      - name: Empaquetar SDK
        run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
